enableRobotsTXT = true

disableKinds = ["taxonomy"]
ignoreErrors = ["error-disable-taxonomy"]

[permalinks]
  blog = "/blog/:slug/"

[params]
  description = "Personal site of Advait Khaire — cybersecurity, writing, and projects."
